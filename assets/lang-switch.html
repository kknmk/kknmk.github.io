<script>
// Rewrites the navbar language-switch link so it points to the
// counterpart of the *current* page. The link is identified by its
// label ("English" / "日本語") because Quarto rewrites href values
// to relative paths at render time.
document.addEventListener("DOMContentLoaded", function () {
  var isJa = (document.documentElement.lang || "").toLowerCase().indexOf("ja") === 0;
  var path = window.location.pathname;
  var target;
  if (isJa) {
    target = path.replace(/^\/ja(\/|$)/, "/");
  } else {
    target = "/ja" + (path.charAt(0) === "/" ? path : "/" + path);
  }
  document.querySelectorAll(".navbar a.nav-link").forEach(function (a) {
    var label = (a.textContent || "").trim();
    if (label === "English" || label === "日本語") {
      a.setAttribute("href", target);
    }
  });
});
</script>
