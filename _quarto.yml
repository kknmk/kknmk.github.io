project:
  type: website

# Bilingual setup:
#   quarto render --profile en  -> _site/      (English)
#   quarto render --profile ja  -> _site/ja/   (Japanese)
# Language-specific settings live in _quarto-en.yml / _quarto-ja.yml.
profile:
  default: en
  group:
    - [en, ja]

website:
  title: "Kakinuma Lab."
  repo-url: "https://github.com/kknmk/kknmk.github.io"
  open-graph: true
  image: images/hero.jpg
  page-footer:
    left: "© Kaoru Kakinuma"
  search: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    smooth-scroll: true
    df-print: paged
    code-fold: false
    link-external-newwindow: true
    include-after-body: assets/lang-switch.html
